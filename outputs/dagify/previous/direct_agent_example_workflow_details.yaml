dag_type: plain_text
description: A workflow that directly produces a concrete example of an AI agent demonstrating
  specific functionality, addressing the request for a tangible agent example rather
  than broad explanations.
name: direct_agent_example_workflow
nodes:
  design_agent_example_code:
    agent: false
    description: Create a specific, executable example of an AI agent that demonstrates
      the core functionalities as requested.
    name: design_agent_example_code
    nodes_depended_on: []
    nodes_dependent_on:
    - explain_agent_example_usage
    prompt: 请编写一个具体的AI Agent代码示例，展示其核心功能，确保示例可以直接运行，并体现系统能力，避免泛泛而谈。
  explain_agent_example_usage:
    agent: false
    description: Generate clear, concise instructions on how to execute and interact
      with the given AI agent example.
    name: explain_agent_example_usage
    nodes_depended_on:
    - design_agent_example_code
    nodes_dependent_on: []
    prompt: 请提供该AI Agent代码示例的使用说明，包括如何运行代码、输入要求、输出解释以及注意事项。
