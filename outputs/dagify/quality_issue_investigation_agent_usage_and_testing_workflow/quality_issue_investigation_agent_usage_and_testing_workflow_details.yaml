dag_type: plain_text
description: Workflow guiding a Quality Engineer on how to use and test the Quality
  Issue Investigation Agent effectively.
name: quality_issue_investigation_agent_usage_and_testing_workflow
nodes:
  explain_agent_example_usage:
    agent: false
    description: Generate clear, concise instructions describing how a Quality Engineer
      should use and interact with the Quality Issue Investigation Agent.
    name: explain_agent_example_usage
    nodes_depended_on:
    - quality_issue_investigation_agent
    nodes_dependent_on:
    - explain_test_method
    prompt: 'Explain how a Quality Engineer should use the Quality Issue Investigation
      Agent.


      Include:


      1. When to use this agent


      2. Example input (realistic quality issue scenario)


      3. What the output means and how to read it


      4. How the engineer should interact iteratively with the agent


      5. Important limitations and best practices


      Keep the explanation practical and concise.'
  explain_test_method:
    agent: false
    description: Describe a practical method for testing and validating the effectiveness
      of the Quality Issue Investigation Agent.
    name: explain_test_method
    nodes_depended_on:
    - explain_agent_example_usage
    nodes_dependent_on: []
    prompt: 'Explain a step-by-step method for a Quality Engineer to test and validate
      the effectiveness of the Quality Issue Investigation Agent.


      Include:


      1. How to prepare test inputs


      2. How to evaluate the agent''s outputs


      3. How to iterate and refine inputs or interactions


      4. Metrics or signs of successful testing


      5. Any tools or techniques to assist in testing


      Keep the explanation focused, practical, and actionable.'
  quality_issue_investigation_agent:
    agent: false
    description: Create a specific, executable example of an AI agent demonstrating
      core functionalities to help engineers investigate semiconductor manufacturing
      quality issues.
    name: quality_issue_investigation_agent
    nodes_depended_on: []
    nodes_dependent_on:
    - explain_agent_example_usage
    prompt: "You are a Quality Issue Investigation Agent for semiconductor manufacturing.\n\
      \nYour goal is to help engineers systematically investigate a quality issue,\
      \ by generating a structured investigation plan instead of jumping to conclusions.\n\
      \nInput context may include:\n\n- Issue description (e.g. defect type, yield\
      \ drop, param out of spec)\n\n- Lot / tool / process step (if available)\n\n\
      - Time range (if available)\n\nYour output MUST include the following sections:\n\
      \n1. Problem Restatement\n\n- Briefly restate the issue in engineering terms.\n\
      \n- Clarify what is abnormal and compared to what baseline.\n\n\n2. Initial\
      \ Hypotheses (Do NOT conclude)\n\n- List 3–5 possible root cause categories,\
      \ such as:\\\\ \n\n\\  - Tool-related\n\n\\  - Material-related\n\n\\  - Process\
      \ drift\n\n\\  - Measurement / inspection issue\n\n\\  - Environmental or human\
      \ factors\n\n\n3. Data to Check (Concrete and Actionable) For each hypothesis,\
      \ specify:\n\n- Which data should be checked (e.g. SPC, inline metrology, WAT,\
      \ equipment logs)\n\n- Suggested breakdown dimensions (tool, chamber, recipe,\
      \ time, product)\n\n\n4. Investigation Sequence\n\n- Recommend a logical order\
      \ to analyze the data\n\n- Start from low-effort / high-signal checks\n\n- Clearly\
      \ indicate decision points (what to do if abnormal / normal)\n\n\n5. Next-Step\
      \ Recommendations\n\n- What information is still missing\n\n- What the engineer\
      \ should provide next to continue the investigation\n\n\nConstraints:\n\n- Do\
      \ not invent data.\n\n- Do not claim a root cause.\n\n- Be practical and aligned\
      \ with real fab investigation workflows.\n\n- Use clear bullet points, not generic\
      \ AI language."
