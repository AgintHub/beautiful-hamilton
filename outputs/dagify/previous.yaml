dag_type: plain_text
description: 为半导体制造质量工程设计的中文质量问题调查代理工作流，分解调查过程为明确、简洁的基本步骤，确保流程符合实际工程操作并便于执行和测试。
name: quality_issue_investigation_agent_cn_redesign
nodes:
  制定初步假设:
    agent: false
    description: 基于问题重述，列举3至5个可能的根因类别，确保避免提前断言根本原因。
    name: 制定初步假设
    nodes_depended_on:
    - 定义问题重述
    nodes_dependent_on:
    - 指定检查数据
    prompt: 针对问题重述，列出3到5个潜在的根因类别（例如设备异常、材料缺陷、工艺漂移等），并说明为何这些类别值得初步关注。
  制定测试方案:
    agent: false
    description: 设计系统的测试和验证方案，确保代理在现实应用中表现有效且可靠。
    name: 制定测试方案
    nodes_depended_on:
    - 编写使用指南
    nodes_dependent_on: []
    prompt: 制定针对代理的系统性测试方案，包括测试输入准备、输出准确性评估、迭代测试调整、成功指标定义及推荐支持工具。
  定义问题重述:
    agent: false
    description: 明确用工程术语精确表述质量问题，定义异常状况并对比基线或预期标准。
    name: 定义问题重述
    nodes_depended_on: []
    nodes_dependent_on:
    - 制定初步假设
    prompt: 请准确用工程专业术语重新表述所遇到的质量问题，明确描述异常表现及其与预期或基线的差异。
  指定检查数据:
    agent: false
    description: 针对每个初步假设，明确具体的数据来源和维度，用以支持后续验证。
    name: 指定检查数据
    nodes_depended_on:
    - 制定初步假设
    nodes_dependent_on:
    - 规划调查顺序
    prompt: 针对每个初步假设，指定需收集和分析的具体数据类型、来源及其分析维度（如设备ID、时间段、配方版本等）。
  提出下一步建议:
    agent: false
    description: 基于前述步骤，明确缺失信息及所需额外投入，指导工程师完善或继续调查。
    name: 提出下一步建议
    nodes_depended_on:
    - 规划调查顺序
    nodes_dependent_on:
    - 编写使用指南
    prompt: 总结当前调查的不足，指出需补充的重要信息和数据，给出针对调查后续深化的具体建议。
  编写使用指南:
    agent: false
    description: 撰写简明的质量问题调查代理使用说明，强调适用场景、示例输入、输出解读及互动策略，适合中文质量工程师阅读。
    name: 编写使用指南
    nodes_depended_on:
    - 提出下一步建议
    nodes_dependent_on:
    - 制定测试方案
    prompt: 编写针对半导体制造质量工程师的使用说明，说明何时使用代理、输入示例、输出各部分含义、交互迭代方法及局限性和风险缓解策略。
  规划调查顺序:
    agent: false
    description: 规划数据分析的逻辑顺序，优先低成本且信息量大的检查，定义决策节点和后续路径。
    name: 规划调查顺序
    nodes_depended_on:
    - 指定检查数据
    nodes_dependent_on:
    - 提出下一步建议
    prompt: 基于指定数据，设计调查的执行顺序，包括优先级排序和明确的决策点，指出如何根据分析结果调整下一步行动。
