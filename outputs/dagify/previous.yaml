dag_type: plain_text
description: 本工作流将现有半导体制造质量问题调查代理相关节点的说明和提示全部翻译成中文，保持整体节点结构和依赖关系不变，确保内容清晰且符合中文语境。
name: quality_issue_investigation_agent_chinese_translation_workflow
nodes:
  explain_agent_example_usage_翻译:
    agent: false
    description: 将质量问题调查代理示例使用说明节点的描述和提示翻译成中文，使其适用中文读者，内容准确且简洁。
    name: explain_agent_example_usage_翻译
    nodes_depended_on:
    - quality_issue_investigation_agent_翻译
    nodes_dependent_on:
    - explain_test_method_翻译
    prompt: '请为质量工程师提供如何高效使用质量问题调查代理的简明实际操作指导。解释内容应涵盖：


      1. 何时及何种场景适合部署该代理以支持质量调查。

      2. 结合半导体制造中的典型质量问题场景，给出真实的输入示例。

      3. 说明代理生成的输出中各部分的含义及其有效分析方法。

      4. 代理的迭代交互最佳实践，如何逐步细化假设和深化调查。

      5. 代理的主要局限性及风险缓解和提升调查效果的建议。


      请使说明内容切实可行、简洁明了，与半导体制造工厂质量工程流程紧密结合，便于理解和应用。'
  explain_test_method_翻译:
    agent: false
    description: 将质量问题调查代理测试方法节点的描述和提示翻译成中文，讲述如何系统而严格地测试和验证该代理在实际中的有效性，内容完整实用。
    name: explain_test_method_翻译
    nodes_depended_on:
    - explain_agent_example_usage_翻译
    nodes_dependent_on: []
    prompt: '请为质量工程师提供一份系统且实用的逐步指南，用于有效测试和验证质量问题调查代理，包括：


      1. 准备结构良好、真实代表性的测试输入，模拟实际质量问题。

      2. 系统评估代理输出与预期结果的准确性、相关性和清晰度。

      3. 迭代调整测试输入和交互模式，探索代理的鲁棒性和适应性。

      4. 定义明确的定量和定性成功指标，如检测准确率、诊断精度、响应一致性及效率。

      5. 推荐实用工具、软件或方法（如测试数据管理、日志框架、版本控制和自动化评估脚本），支持严格检测。


      确保说明具有实操性、可操作且直接适用于现实质量工程流程，推动代理性能的持续提升。'
  quality_issue_investigation_agent_翻译:
    agent: false
    description: 将质量问题调查代理节点的描述和提示内容翻译成中文，确保准确传达技术细节和操作指导。
    name: quality_issue_investigation_agent_翻译
    nodes_depended_on: []
    nodes_dependent_on:
    - explain_agent_example_usage_翻译
    prompt: "你是一个半导体制造质量问题调查代理。\n\n你的使命是帮助工程师有纪律且系统地调查质量问题，避免过早推断根本原因。生成一个结构化的、可执行的调查计划，包含以下部分：\n\
      \n1. 问题重述\n- 用精确的工程术语简明翻译问题。\n- 明确定义异常状况，并与基线或预期标准进行对比。\n\n2. 初步假设（明确避免结论）\n\
      - 列举3至5个可能的根因类别，如：\n  - 设备相关异常（如设备故障或校准偏差）\n  - 材料相关缺陷（如污染或供应商差异）\n  - 工艺漂移或配方偏差\n\
      \  - 测量或检测系统误差\n  - 环境因素或人为因素\n\n3. 需要检查的数据（具体可操作）\n- 对每个假设，指定具体的数据来源（如统计过程控制图、在线计量报告、晶圆验收测试数据、设备维护日志）。\n\
      - 建议详细的分析维度，包括设备ID、腔体编号、配方版本、时间段和产品标识。\n\n4. 调查顺序\n- 建议分析数据的最佳逻辑顺序，优先考虑低成本高信息量的检查。\n\
      - 定义明确的决策点，指示发现异常或未发现异常时的后续行动。\n\n5. 下一步建议\n- 确定完善或继续调查所需的重要缺失信息。\n- 建议工程师提供哪些额外输入或数据以强化后续调查。\n\
      \n指导原则：\n- 不编造或假设未经验证的数据。\n- 不断言或声称最终根本原因。\n- 保持与现实半导体制造调查实践的一致性。\n- 采用精确、条理清晰、工程化的表达，避免通用AI措辞。\n\
      \n输入语境可包含问题描述（缺陷类型、良率下降、参数偏差）、受影响的批次/设备/工艺步骤及相关时间范围。\n\n请教我怎么测试效果呢"
