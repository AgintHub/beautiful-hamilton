dag_type: plain_text
description: Generated workflow from UI.
name: quality_issue_investigation_agent_usage_and_testing_workflow
nodes:
  explain_agent_example_usage:
    agent: false
    description: Provide succinct, pragmatic instructions for Quality Engineers on
      efficiently leveraging the Quality Issue Investigation Agent in semiconductor
      manufacturing environments. This includes guidance on identification of appropriate
      usage scenarios, interpretation of agent outputs, iterative interaction protocols
      to refine investigations, and cautionary notes on agent limitations and best
      practices to maximize investigation effectiveness and maintain data integrity.
      The explanation is grounded in real-world fab workflows to ensure practical
      applicability and clear understanding.
    name: explain_agent_example_usage
    nodes_depended_on:
    - quality_issue_investigation_agent
    nodes_dependent_on: []
    prompt: 'Detail how a Quality Engineer should optimally engage with the Quality
      Issue Investigation Agent. Your explanation must cover:


      1. Appropriate scenarios and timings for deploying this agent during quality
      investigations.


      2. A realistic example input illustrating a typical quality issue scenario from
      semiconductor manufacturing.


      3. Interpretation of the generated output sections—what each segment means and
      how to effectively analyze them.


      4. Best practices for iterative interaction with the agent to progressively
      refine hypotheses and investigation depth.


      5. Key limitations of the agent and recommended strategies to mitigate risks
      and enhance investigation outcomes.


      Keep the explanation actionable, concise, and closely aligned with actual semiconductor
      fab quality engineering processes.'
  explain_test_method:
    agent: false
    description: Detail a systematic, practical methodology for Quality Engineers
      to rigorously test, validate, and optimize the Quality Issue Investigation Agent's
      effectiveness. This includes designing relevant test cases, preparing realistic
      input scenarios, evaluating the agent’s diagnostic outputs, and refining interaction
      strategies. The method integrates objective metrics and qualitative indicators
      to assess success, along with recommended tools and best practices to ensure
      thorough, repeatable validation aligned with real-world quality assurance workflows.
    name: explain_test_method
    nodes_depended_on:
    - explain_agent_example_usage
    nodes_dependent_on: []
    prompt: 'Provide a comprehensive, step-by-step guide for a Quality Engineer to
      effectively test and validate the Quality Issue Investigation Agent by:


      1. Preparing well-structured and representative test inputs that simulate realistic
      quality issues.

      2. Systematically evaluating the accuracy, relevance, and clarity of the agent''s
      outputs against expected investigation outcomes.

      3. Iteratively refining test inputs and interaction patterns to probe the agent’s
      robustness and adaptability.

      4. Defining clear quantitative and qualitative success metrics—such as detection
      accuracy, diagnostic precision, response consistency, and efficiency.

      5. Recommending practical tools, software, or methods (e.g., test data management,
      logging frameworks, version control, and automated evaluation scripts) to facilitate
      rigorous testing.


      Ensure that the explanation remains practical, actionable, and directly applicable
      to real-world quality engineering processes, promoting continuous improvement
      of agent performance.'
  quality_issue_investigation_agent:
    agent: false
    description: Develop an AI-driven investigation assistant tailored for semiconductor
      manufacturing quality issues, enabling engineers to systematically and methodically
      dissect anomalies in fabrication processes. This agent synthesizes domain-specific
      inputs such as defect typology, yield trends, process steps, tool usage, and
      temporal data, delivering a rigorous, structured investigation roadmap aligned
      with standard semiconductor fab workflows. It aids in avoiding premature conclusions
      by emphasizing hypothesis generation, data-driven verification, and logical
      sequencing of investigative actions, all framed with engineering precision and
      actionable clarity.
    name: quality_issue_investigation_agent
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: "You are a Semiconductor Manufacturing Quality Issue Investigation Agent.\n\
      \nYour mission is to assist engineers in conducting a disciplined and systematic\
      \ investigation of quality issues without inferring root causes prematurely.\
      \ Generate a comprehensive, actionable investigation plan structured into the\
      \ following sections:\n\n1. Problem Restatement\n- Concisely translate the issue\
      \ into precise engineering terms.\n- Define the abnormal condition explicitly\
      \ and contrast it against a meaningful baseline or expected norm.\n\n2. Initial\
      \ Hypotheses (Explicitly Avoid Conclusions)\n- Enumerate 3 to 5 plausible root\
      \ cause categories, such as:\n   - Tool-related anomalies (e.g., equipment faults\
      \ or miscalibration)\n   - Material-related defects (e.g., contamination or\
      \ supplier variability)\n   - Process drift or recipe deviations\n   - Measurement\
      \ or inspection system errors\n   - Environmental influences or human factors\n\
      \n3. Data to Check (Concrete and Actionable)\n- For each hypothesis, specify\
      \ precise data sources to examine (e.g., Statistical Process Control charts,\
      \ inline metrology reports, wafer acceptance test data, equipment maintenance\
      \ logs).\n- Recommend detailed breakdown dimensions for analysis, including\
      \ tool ID, chamber number, recipe version, chronological segments, and product\
      \ identifiers.\n\n4. Investigation Sequence\n- Propose an optimal logical order\
      \ for analyzing data, prioritizing low-effort, high-informative-value checks\
      \ first.\n- Define clear decision points with instructions on subsequent actions\
      \ depending on whether abnormalities are found or not.\n\n5. Next-Step Recommendations\n\
      - Identify critical missing information necessary to refine or continue the\
      \ investigation.\n- Advise engineers on what additional inputs or data provision\
      \ will enhance subsequent investigative steps.\n\nGuidelines:\n- Do not fabricate\
      \ or assume unverified data.\n- Do not assert or claim final root causes.\n\
      - Maintain practical alignment with real-world semiconductor fabrication investigation\
      \ practices.\n- Employ precise, bulleted, and engineering-centric language,\
      \ avoiding generic AI phrasing.\n\nInput context may include issue descriptions\
      \ (defect type, yield yield drops, parameter deviations), affected lot/tool/process\
      \ step, and relevant time ranges.\n\n请教我怎么测试效果呢"
