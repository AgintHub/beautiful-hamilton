dag_type: plain_text
description: This workflow creates an AI agent that demonstrates the capabilities
  of the system, explains its functions, and provides instructions on how to run and
  use the created agent.
name: explain_and_build_agent_to_understand_functionality
nodes:
  build_ai_agent_structure:
    agent: false
    description: Construct the AI agent with the defined functionalities that will
      represent the system's capabilities.
    name: build_ai_agent_structure
    nodes_depended_on:
    - define_agent_functionality_scope
    nodes_dependent_on:
    - create_usage_instructions
    prompt: 根据指定的功能，设计并构建该AI Agent的结构，确保它能够演示系统的核心功能。
  create_usage_instructions:
    agent: false
    description: Generate clear instructions on how to run and use the newly built
      AI agent.
    name: create_usage_instructions
    nodes_depended_on:
    - build_ai_agent_structure
    nodes_dependent_on: []
    prompt: 请编写详细的操作指南，说明如何运行和使用该AI Agent，包括启动方法、输入输出说明及使用注意事项。
  define_agent_functionality_scope:
    agent: false
    description: Define the specific functionalities that the new AI agent will demonstrate
      to showcase system capabilities.
    name: define_agent_functionality_scope
    nodes_depended_on:
    - explain_agent_capabilities_overview
    nodes_dependent_on:
    - build_ai_agent_structure
    prompt: 基于系统功能，明确新的AI Agent将具备哪些具体功能以展示其能力。
  explain_agent_capabilities_overview:
    agent: false
    description: Provide a clear explanation of what the AI system can do to help
      users understand its functions.
    name: explain_agent_capabilities_overview
    nodes_depended_on: []
    nodes_dependent_on:
    - define_agent_functionality_scope
    prompt: 请详细说明该AI系统的主要功能和应用场景，帮助用户理解它可以完成哪些任务。
